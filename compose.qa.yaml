name: trilhacode-phase2r4-qa

services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${QA_MONGO_ROOT_USERNAME:?Set QA_MONGO_ROOT_USERNAME in .env.qa}
      MONGO_INITDB_ROOT_PASSWORD: ${QA_MONGO_ROOT_PASSWORD:?Set QA_MONGO_ROOT_PASSWORD in .env.qa}
    volumes:
      - qa_mongo_data:/data/db
    networks:
      - qa_internal
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "${QA_MONGO_ROOT_USERNAME}", "--password", "${QA_MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENV: development
      MONGO_URL: mongodb://${QA_MONGO_ROOT_USERNAME}:${QA_MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      DB_NAME: trilhacode_phase2r4_qa
      JWT_SECRET: ${QA_JWT_SECRET:?Set QA_JWT_SECRET in .env.qa}
      FRONTEND_URL: http://localhost:13000
      CORS_ORIGINS: http://localhost:13000
      COOKIE_SAMESITE: lax
      COOKIE_SECURE: "false"
    # Database bootstrap is run as explicit one-off commands before starting this service.
    command: ["uvicorn", "server:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - ./backend:/app
    networks:
      - qa_internal
      - qa_access
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_BACKEND_URL: http://localhost:18000
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - ./frontend:/app
      - qa_frontend_node_modules:/app/node_modules
    networks:
      - qa_access
    depends_on:
      api:
        condition: service_healthy

networks:
  qa_internal:
    name: trilhacode_phase2r4_qa_internal
    internal: true
  qa_access:
    name: trilhacode_phase2r4_qa_access
    driver: bridge

volumes:
  qa_mongo_data:
    name: trilhacode_phase2r4_qa_mongo_data
  qa_frontend_node_modules:
    name: trilhacode_phase2r4_qa_frontend_node_modules
