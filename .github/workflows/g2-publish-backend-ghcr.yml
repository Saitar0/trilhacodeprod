name: G2 - Publish approved backend image to GHCR

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: trilhacode-g2-ghcr
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: g2-image-publish
    env:
      APPROVED_SHA: ${{ github.sha }}
      IMAGE: ghcr.io/saitar0/trilhacodeprod-backend:g2-${{ github.sha }}
    steps:
      - name: Checkout approved source only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify source and Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test -f backend/Dockerfile.prod
          echo "Using approved commit: $APPROVED_SHA"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image (not a deployment)
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.prod
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}
          provenance: true

      - name: Record immutable image digest
        shell: bash
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          case "$DIGEST" in sha256:*) ;; *) echo 'Unexpected digest' >&2; exit 1 ;; esac
          {
            echo '## G2 image published to GHCR'
            echo "- Approved source commit: \`$APPROVED_SHA\`"
            echo "- Registry tag: \`$IMAGE\`"
            echo "- Immutable image reference: \`ghcr.io/saitar0/trilhacodeprod-backend@$DIGEST\`"
            echo '- No SSH, Coolify, MongoDB, VPS, migration, or deployment operations were performed.'
            echo '- Keep the package private and authorize a separate staging pull/runner setup.'
          } >> "$GITHUB_STEP_SUMMARY"
