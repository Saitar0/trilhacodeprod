name: CI and Coolify deploy

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Publicar somente depois da aprovação operacional do release"
        type: choice
        options: [none, staging, production]
        default: none
        required: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend test and quality dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run Ruff
        run: ruff check backend
      - name: Run isolated backend tests
        run: python -m pytest
        working-directory: backend
        env:
          ENV: development
          MONGO_URL_TEST: mongodb://localhost:27017
          JWT_SECRET: ci-only-not-a-secret
      - run: python -m compileall -q backend
        env:
          ENV: development
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: trilhacode_ci
          JWT_SECRET: ci-only-not-a-secret
      - name: Reject insecure production configuration
        shell: bash
        env:
          ENV: production
          MONGO_URL: mongodb://ci:ci@mongo.example.invalid:27017/ci?authSource=admin
          DB_NAME: ci
          JWT_SECRET: short
          FRONTEND_URL: https://app.example.com
          CORS_ORIGINS: https://app.example.com
          COOKIE_DOMAIN: .example.com
          COOKIE_SAMESITE: Lax
          COOKIE_SECURE: "true"
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: ci-only-long-password
        run: |
          if output=$(PYTHONPATH=backend python -c 'import settings' 2>&1); then
            echo "Unsafe production config was accepted" >&2
            exit 1
          fi
          echo "$output"
          case "$output" in
            *"JWT_SECRET"*) ;;
            *) echo "Production validation failed for an unexpected reason" >&2; exit 1 ;;
          esac
      - name: Build production API image
        run: docker build -f backend/Dockerfile.prod -t trilhacode-api:ci .
      - name: Audit production Python dependencies
        run: pip-audit -r backend/requirements.prod.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Typecheck frontend
        run: npm run typecheck
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
      - name: Test frontend
        run: npm test
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
        working-directory: frontend

  deploy-staging:
    needs: [backend, frontend]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'staging' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger Coolify staging deployment
        env:
          WEBHOOK: ${{ secrets.COOLIFY_STAGING_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_STAGING_TOKEN }}
        run: |
          test -n "$WEBHOOK" && test -n "$TOKEN"
          curl --fail --silent --show-error --retry 3 \
            --request GET "$WEBHOOK" \
            --header "Authorization: Bearer $TOKEN"

  deploy-production:
    needs: [backend, frontend]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Coolify production deployment
        env:
          WEBHOOK: ${{ secrets.COOLIFY_PRODUCTION_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_PRODUCTION_TOKEN }}
        run: |
          test -n "$WEBHOOK" && test -n "$TOKEN"
          curl --fail --silent --show-error --retry 3 \
            --request GET "$WEBHOOK" \
            --header "Authorization: Bearer $TOKEN"
