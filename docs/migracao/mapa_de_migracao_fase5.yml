    "evidencias": ["Q4: “apaga o cookie no navegador, mas não invalida a sessão no servidor” — avalia o ciclo da sessão.","P3: “login, uso autenticado, renovação/expiração e logout” — objetivo de ciclo de credenciais; implementação por sessão ou provedor é condicional.","Q5 associa ID Token, access token e refresh token — item compartilhado entre tokens/JWT e OAuth/OIDC."]
