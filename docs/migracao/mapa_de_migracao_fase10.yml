          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/52.2_Projeto_de_fase_Trilho_B.md
          seletor: '### Entrega 1 — Caso de uso, limites e desenho'
          linha_inicio: 29
          linha_fim: 31
          titulo_marco_literal: Caso de uso, limites e desenho
          texto_literal: '### Entrega 1 — Caso de uso, limites e desenho

            Escolha a variação T6 e descreva usuário, tarefa, fluxo atual e por que busca/geração/ferramenta ajuda. Liste
            dados e permissões, saídas esperadas, situações para não responder e o que fica explicitamente fora de escopo.
            Defina critérios de aceite, métricas e casos de avaliação antes de implementar. Desenhe a sequência interface/API/dados/provedor/ferramenta
            e registre uma ADR curta com alternativas, decisão, consequências, custo e risco.'
        titulo_marco: Caso de uso, limites e desenho
      C01:
        path: 21_aceite_caso_de_uso_limites_e_desenho.md
        tipo: checklist
        arquivo_id: f10-52-2-c01
        origem: &id195
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/52.2_Projeto_de_fase_Trilho_B.md
          seletor: '**Critérios de aceite:**'
          linha_inicio: 32
          linha_fim: 32
          titulo_marco_literal: Caso de uso, limites e desenho
          texto_literal: '**Critérios de aceite:** problema é específico; existe hipótese verificável; a escolha está ligada
            à variação; dados são sintéticos/autorizados; critérios distinguem comportamento correto, sem suporte e negado.'
        titulo_marco: Caso de uso, limites e desenho
        marco_ref: M01
      M02:
        path: 12_fatia_vertical_com_limite_de_confianca.md
        tipo: project_milestone
        arquivo_id: f10-52-2-m02
        origem: &id196
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/52.2_Projeto_de_fase_Trilho_B.md
          seletor: '### Entrega 2 — Fatia vertical com limite de confiança'
          linha_inicio: 38
          linha_fim: 40
          titulo_marco_literal: Fatia vertical com limite de confiança
          texto_literal: '### Entrega 2 — Fatia vertical com limite de confiança

            Implemente o fluxo mínimo até uma resposta utilizável. Para documentos, mantenha origem e permissões em cada trecho
            recuperado. Para copiloto, separe sugestão de execução e exija confirmação concreta antes de enviar ou alterar.
            Para busca, preserve filtros e metadados do item e forneça motivo/resultado verificável. Faça autorização no backend,
            valide entrada/saída e limite contexto, número de resultados, chamadas e tamanho de resposta. Não exponha credenciais
            nem conteúdo fora do escopo ao provedor ou ao cliente.'
        titulo_marco: Fatia vertical com limite de confiança
      C02:
        path: 22_aceite_fatia_vertical_com_limite_de_confianca.md
        tipo: checklist
        arquivo_id: f10-52-2-c02
        origem: &id197
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/52.2_Projeto_de_fase_Trilho_B.md
          seletor: '**Critérios de aceite:**'
          linha_inicio: 41
          linha_fim: 41
          titulo_marco_literal: Fatia vertical com limite de confiança
          texto_literal: '**Critérios de aceite:** fluxo normal funciona com dados sintéticos; cada recurso é autorizado pela
            identidade da sessão; resultado tem evidência conforme a variante; entrada inválida, ausência de suporte e erro
            externo são tratados sem inventar sucesso.'
        titulo_marco: Fatia vertical com limite de confiança
        marco_ref: M02
      M03:
        path: 13_avaliacao_custo_e_latencia.md
        tipo: project_milestone
        arquivo_id: f10-52-2-m03
        origem: &id198
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/52.2_Projeto_de_fase_Trilho_B.md
          seletor: '### Entrega 3 — Avaliação, custo e latência'
          linha_inicio: 47
          linha_fim: 51
          titulo_marco_literal: Avaliação, custo e latência
          texto_literal: '### Entrega 3 — Avaliação, custo e latência

            Construa um conjunto de casos representativos para a variante. Inclua sucesso esperado, consulta ambígua, sem
            suporte, conflito ou resultado vazio e ao menos um caso de abuso. Para RAG, avalie recuperação e resposta/citação
            separadamente; para copiloto, avalie utilidade e correção da sugestão, além de ação confirmada; para catálogo,
            avalie posição dos itens relevantes e resultado sem correspondência. Use a mesma versão de dados e configurações
            ao comparar antes/depois de uma mudança.


            Meça latência do caminho relevante e uso/custo segundo tarifa atual, incluindo falhas e retries quando aplicável.
            Registre modelo/versão, parâmetros, corpus/dados, prompt, método e limitações. Revise manualmente uma amostra.
            Não interprete poucos casos como qualidade geral e não use o próprio modelo como único juiz sem validação.'
        titulo_marco: Avaliação, custo e latência
      C03:
        path: 23_aceite_avaliacao_custo_e_latencia.md
        tipo: checklist
        arquivo_id: f10-52-2-c03
        origem: &id199
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/52.2_Projeto_de_fase_Trilho_B.md
          seletor: '**Critérios de aceite:**'
          linha_inicio: 52
          linha_fim: 52
          titulo_marco_literal: Avaliação, custo e latência
          texto_literal: '**Critérios de aceite:** casos e critérios existem antes da execução; resultado é reproduzível;
            custo e latência têm método explícito; análise separa erro de recuperação, geração ou regra de produto.'
        titulo_marco: Avaliação, custo e latência
        marco_ref: M03
      M04:
        path: 14_modelo_de_ameacas_controles_e_aceite.md
        tipo: project_milestone
        arquivo_id: f10-52-2-m04
        origem: &id200
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/52.2_Projeto_de_fase_Trilho_B.md
          seletor: '### Entrega 4 — Modelo de ameaças, controles e aceite'
          linha_inicio: 58
          linha_fim: 60
          titulo_marco_literal: Modelo de ameaças, controles e aceite
          texto_literal: '### Entrega 4 — Modelo de ameaças, controles e aceite

            Faça um modelo de ameaças curto com ativos, atores, fronteiras e caminhos de ataque apropriados: instrução hostil
            em documento/entrada, acesso cruzado, vazamento em log/resposta e ação indevida ou falsa confirmação. Demonstre
            controles com testes ou cenários reproduzíveis, inclusive uma tentativa negada e um caso legítimo para verificar
            falso positivo. Defina tratamento de credenciais, logs, retenção, falha, limites de custo e procedimento para
            desligar a integração. Atualize README, ADR, diagrama e estado de cobertura de T1–T5; tipos pendentes ficam num
            plano separado.'
        titulo_marco: Modelo de ameaças, controles e aceite
      C04:
        path: 24_aceite_modelo_de_ameacas_controles_e_aceite.md
        tipo: checklist
        arquivo_id: f10-52-2-c04
        origem: &id201
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/52.2_Projeto_de_fase_Trilho_B.md
          seletor: '**Critérios de aceite:**'
          linha_inicio: 61
          linha_fim: 61
          titulo_marco_literal: Modelo de ameaças, controles e aceite
          texto_literal: '**Critérios de aceite:** riscos prioritários estão ligados a controles efetivamente verificados;
            segredos e dados de terceiros não aparecem nos artefatos; a execução pode ser reproduzida; limitações, riscos
            residuais e estado da cobertura estão explícitos.'
        titulo_marco: Modelo de ameaças, controles e aceite
        marco_ref: M04
      CHK:
        path: 90_checklist_final.md
        tipo: checklist
        arquivo_id: f10-52-2-chk
        origem: &id202
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/52.2_Projeto_de_fase_Trilho_B.md
          seletor: '## Checklist de entrega'
          linha_inicio: 67
          linha_fim: 76
          itens: 8
          texto_literal: '## Checklist de entrega

            - [ ] Escolher uma variação T6 e registrar usuário, problema e limite do escopo.

            - [ ] Implementar fluxo com recuperação/citação ou ferramenta autorizada conforme a variação.

            - [ ] Criar casos de avaliação com resposta esperada e casos sem suporte/hostis.

            - [ ] Registrar método, resultados e limitações da avaliação.

            - [ ] Medir custo e latência com método reproduzível, incluindo falha quando possível.

            - [ ] Produzir modelo de ameaças e demonstrar controles no sistema.

            - [ ] Consultar tabela de cobertura; planejar recuperações T1–T5 separadamente.

            - [ ] Documentar execução, ADR, decisões e riscos residuais.'
        quantidade_itens: 8
      R00:
        path: 91_rubrica_final.md
        tipo: rubric
        arquivo_id: f10-52-2-r00
        origem: &id203
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/52.2_Projeto_de_fase_Trilho_B.md
          seletor: '## Rubrica final'
          linha_inicio: 77
          linha_fim: 90
          dimensoes: 6
          texto_literal: '## Rubrica final

            Atribua 0, 1 ou 2 por critério. Exija pelo menos 10/12 pontos, sem zero em T6, autorização/segurança ou avaliação.
            Um projeto com falha de autorização ou sem demonstração da regra central não está aceito, independentemente da
            soma.


            | Critério | 0 — ausente | 1 — parcial | 2 — evidência suficiente |

            |---|---|---|---|

            | Problema e variante | sem problema ou variante definida | escopo amplo/benefício incerto | usuário, necessidade
            e fluxo mínimo claros |

            | Demonstração da regra T6 | sem comportamento central | fluxo funciona sem prova do limite específico | citação/ação/busca
            demonstra o critério da variante |

            | Avaliação | sem conjunto ou método | casos/métricas parciais | casos rotulados, resultados reproduzíveis e revisão
            de amostra |

            | Segurança e autorização | acesso ou efeito não controlados | controles existem sem teste suficiente | ameaça
            testada e autorização/limites aplicados no backend |

            | Custo, latência e falhas | sem medidas | medição ou falha parcial | método, uso/custo, latência e ao menos uma
            falha documentados |

            | Documentação e cobertura | não reproduzível/cobertura misturada | documentação ou status incompletos | README/ADR/limitações
            claros e T1–T5 separados de T6 |


            **Interpretação:** 10–12 pontos e gates sem zero: pronto para aceite; 7–9 ou qualquer pendência de gate: corrigir
            e reapresentar; 0–6: revisar os marcos necessários. Recuperações T1–T5 têm aceite próprio e não alteram a nota/gates
            de T6.'
        escala_rubrica: 0–2
        dimensoes: 6
        total: 12
