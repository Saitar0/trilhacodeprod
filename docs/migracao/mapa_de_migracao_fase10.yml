        origem: &id016
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/47.1_Uso_assistido.md
          seletor: '### Atividade 1 — Preparar uma tarefa assistida'
          linha_inicio: 53
          linha_fim: 57
          texto_literal: '### Atividade 1 — Preparar uma tarefa assistida

            Escolha uma melhoria pequena em repositório de estudo. Antes de conversar com a ferramenta, registre comportamento
            atual, resultado esperado, arquivos dentro do escopo, restrições, exemplos e critérios de aceite. Separe o contexto
            permitido do que deve ser removido ou substituído por dados sintéticos. Peça à ferramenta um plano e perguntas
            em aberto antes de solicitar alteração.


            **Entregável:** ficha de tarefa e prompt, plano proposto, lista de dúvidas/pressupostos e decisão sobre contexto
            compartilhado.'
        item_origem: P01
        assunto: 02_contexto_e_criterios
      KP01:
        path: 02_contexto_e_criterios/KP01_feedback.md
        tipo: answer_key_pratica
        arquivo_id: f10-47-1-kp01
        origem: &id017
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/47.1_Uso_assistido.md
          seletor: '**Feedback para revisar:'
          linha_inicio: 58
          linha_fim: 58
          texto_literal: '**Feedback para revisar:** a tarefa está pronta quando outra pessoa consegue decidir se a mudança
            atende aos critérios sem adivinhar intenção. Remova qualquer segredo ou dado real sem autorização. Se a ferramenta
            recebeu um prompt genérico como “melhore o projeto”, reduza a tarefa e especifique comportamento observável.'
        item_origem: P01
        responde_a: P01
        assunto: 02_contexto_e_criterios
      P02:
        path: 04_revisao_e_verificacao/P02_pratica.md
        tipo: practice
        arquivo_id: f10-47-1-p02
        origem: &id018
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/47.1_Uso_assistido.md
          seletor: '### Atividade 2 — Revisar um diff com falhas plantadas'
          linha_inicio: 60
          linha_fim: 64
          texto_literal: '### Atividade 2 — Revisar um diff com falhas plantadas

            Use a saída da atividade 1 ou um diff didático. Inclua ou procure pelo menos três riscos: mudança além do escopo,
            caso inválido sem validação, teste apagado/insuficiente, dependência não justificada ou dado sensível em log.
            Para cada achado, indique trecho, requisito afetado, impacto e correção/verificação necessária. Peça à própria
            ferramenta uma revisão separada e compare as respostas, sem tratar nenhuma como autoridade final.


            **Entregável:** checklist ou tabela de achados com evidência, severidade, decisão e ação corretiva; registro de
            um falso positivo ou risco que a revisão automatizada deixou passar, se houver.'
        item_origem: P02
        assunto: 04_revisao_e_verificacao
      KP02:
        path: 04_revisao_e_verificacao/KP02_feedback.md
        tipo: answer_key_pratica
        arquivo_id: f10-47-1-kp02
        origem: &id019
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/47.1_Uso_assistido.md
          seletor: '**Feedback para revisar:'
          linha_inicio: 65
          linha_fim: 65
          texto_literal: '**Feedback para revisar:** cada apontamento deve citar evidência do diff e explicar a relação com
            requisito ou risco. “Não gostei” não basta; descreva o comportamento que deveria mudar. Se não encontrar três
            falhas, use o cenário alternativo fornecido pelo instrutor ou introduza defeitos didáticos em uma cópia isolada,
            sem contaminar o projeto principal.'
        item_origem: P02
        responde_a: P02
        assunto: 04_revisao_e_verificacao
      P03:
        path: 04_revisao_e_verificacao/P03_pratica.md
        tipo: practice
        arquivo_id: f10-47-1-p03
        origem: &id020
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/47.1_Uso_assistido.md
          seletor: '### Atividade 3 — Verificar e registrar a decisão'
          linha_inicio: 67
          linha_fim: 71
          texto_literal: '### Atividade 3 — Verificar e registrar a decisão

            Implemente ou refine a melhoria aprovada. Execute as verificações adequadas ao projeto, examine os resultados
            e compare cada critério de aceite com uma evidência. Registre sugestões aceitas e rejeitadas, decisões humanas,
            limitações e o que ainda precisa de revisão. Não integre nem publique automaticamente só porque a ferramenta relata
            sucesso.


            **Entregável:** diff final, resultado das verificações, matriz critério → evidência e nota curta de decisões/limitações.'
        item_origem: P03
        assunto: 04_revisao_e_verificacao
      KP03:
        path: 04_revisao_e_verificacao/KP03_feedback.md
        tipo: answer_key_pratica
        arquivo_id: f10-47-1-kp03
        origem: &id021
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/47.1_Uso_assistido.md
          seletor: '**Feedback para revisar:'
          linha_inicio: 72
          linha_fim: 72
          texto_literal: '**Feedback para revisar:** conclusão suficiente exige que você explique cada trecho aceito, que
            as verificações citadas tenham sido realmente executadas e que resultados negativos ou não verificados estejam
            declarados. Se só há a afirmação do agente, ainda não existe evidência independente.'
        item_origem: P03
        responde_a: P03
        assunto: 04_revisao_e_verificacao
