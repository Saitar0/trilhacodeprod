        origem: &id078
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/48.2_Operacao.md
          seletor: '**Feedback para revisar:'
          linha_inicio: 70
          linha_fim: 70
          texto_literal: '**Feedback para revisar:** compare resultados equivalentes e não confunda amostra pequena com garantia
            de capacidade. Uma média sozinha pode esconder respostas lentas; descreva distribuição/amostra e erros. O rate
            limit deve estar no backend e a telemetria não deve exigir armazenar prompts/respostas sensíveis.'
        item_origem: P03
