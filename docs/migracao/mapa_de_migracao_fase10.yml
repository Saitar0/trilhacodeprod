        origem: &id074
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/48.2_Operacao.md
          seletor: '**Feedback para revisar:'
          linha_inicio: 56
          linha_fim: 56
          texto_literal: '**Feedback para revisar:** todas as transições devem impedir mistura de respostas e distinguir sucesso
            completo de resposta parcial. Se um erro após fragmentos termina como “concluído”, corrija o modelo. Inclua como
            a nova solicitação invalida a anterior.'
        item_origem: P01
        responde_a: P01
        assuntos: *id062
      P02:
        path: 90_integracao/P02_pratica.md
        tipo: practice
        arquivo_id: f10-48-2-p02
