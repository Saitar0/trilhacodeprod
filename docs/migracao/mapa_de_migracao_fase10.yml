        origem: &id101
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/49.1_Base.md
          seletor: '### Atividade 1 — Preparar corpus e política de indexação'
          linha_inicio: 51
          linha_fim: 55
          texto_literal: '### Atividade 1 — Preparar corpus e política de indexação

            Use documentos públicos ou sintéticos autorizados. Escolha de 5 a 10 documentos variados e crie um inventário
            com ID, origem, versão/data, seção, permissão e estado de ingestão. Escreva uma regra inicial de extração e chunking;
            escolha pelo menos dois parâmetros que serão comparados e defina como atualização/remoção de uma fonte se reflete
            no índice.


            **Entregável:** inventário, regra de chunking e diagrama/tabela do fluxo ingestão → chunks → embeddings → índice.'
        item_origem: P01
        assunto: 01_preparacao_indexacao_fontes
      KP01:
        path: 01_preparacao_indexacao_fontes/KP01_feedback.md
        tipo: answer_key_pratica
        arquivo_id: f10-49-1-kp01
        origem: &id102
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/49.1_Base.md
          seletor: '**Feedback para revisar:'
          linha_inicio: 56
          linha_fim: 56
          texto_literal: '**Feedback para revisar:** outra pessoa deve conseguir rastrear um chunk até o documento e sua versão.
            Se uma permissão se perde na transformação, corrija antes de testar geração. Inclua como identificar falha de
            extração, atualização e remoção; não use dados que você não pode enviar ao serviço escolhido.'
        item_origem: P01
        responde_a: P01
        assunto: 01_preparacao_indexacao_fontes
      P02:
        path: 90_integracao/P02_pratica.md
        tipo: practice
        arquivo_id: f10-49-1-p02
        origem: &id103
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/49.1_Base.md
          seletor: '### Atividade 2 — Construir busca com citações e acesso'
          linha_inicio: 58
          linha_fim: 62
          texto_literal: '### Atividade 2 — Construir busca com citações e acesso

            Implemente a consulta com embedding/busca vetorial, metadados, filtro de acesso no servidor, limite de resultados
            e resposta com referências aos chunks retornados. Use ao menos um caso com termo exato para observar se busca
            vetorial, lexical ou uma combinação atende melhor. Inclua uma consulta que deve retornar “sem suporte” e um documento
            sintético com instrução hostil, sem oferecer ferramentas que executem ações.


            **Entregável:** fluxo executável, conjunto sintético, exemplos de resultados recuperados e resposta com citação
            que abre o trecho de origem.'
        item_origem: P02
        assuntos: &id091
        - 02_embeddings_e_recuperacao
        - 03_resposta_fundamentada_citacoes
      KP02:
        path: 90_integracao/KP02_feedback.md
        tipo: answer_key_pratica
        arquivo_id: f10-49-1-kp02
        origem: &id104
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/49.1_Base.md
          seletor: '**Feedback para revisar:'
          linha_inicio: 63
          linha_fim: 63
          texto_literal: '**Feedback para revisar:** confirme que a busca respeita acesso antes de o contexto chegar ao modelo
            e que a citação aponta para o chunk usado. Um ID citado que não veio da recuperação, uma fonte inacessível ou
            um trecho que não apoia a afirmação é falha. Resposta sem suporte deve se abster ou explicar a limitação.'
        item_origem: P02
        responde_a: P02
        assuntos: *id091
      P03:
        path: 04_avaliacao_recuperacao_resposta/P03_pratica.md
        tipo: practice
        arquivo_id: f10-49-1-p03
        origem: &id105
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/49.1_Base.md
          seletor: '### Atividade 3 — Avaliar e melhorar uma variável'
          linha_inicio: 65
          linha_fim: 69
          texto_literal: '### Atividade 3 — Avaliar e melhorar uma variável

            Prepare pelo menos dez perguntas rotuladas: cobertas, sem resposta, ambíguas, conflitantes, termo exato e conteúdo
            hostil. Marque os trechos relevantes antes de executar. Calcule recall@k e precision@k para recuperação; avalie
            separadamente suporte da resposta, correção das citações e abstinência. Compare uma alteração de chunking ou uma
            combinação lexical/vetorial usando os mesmos casos, e registre versões e limitações.


            **Entregável:** conjunto rotulado, tabela de métricas por configuração, amostra revisada manualmente e breve análise
            das falhas observadas.'
        item_origem: P03
        assunto: 04_avaliacao_recuperacao_resposta
      KP03:
        path: 04_avaliacao_recuperacao_resposta/KP03_feedback.md
        tipo: answer_key_pratica
        arquivo_id: f10-49-1-kp03
        origem: &id106
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/49.1_Base.md
          seletor: '**Feedback para revisar:'
          linha_inicio: 70
          linha_fim: 70
          texto_literal: '**Feedback para revisar:** métricas só fazem sentido com relevância previamente marcada; não rotule
            depois de ver qual resultado “ganhou”. Separe falha de recuperação de falha de geração e mantenha perguntas/corpus
            iguais ao comparar. Se uma resposta correta não aparece porque o trecho não foi recuperado, ajuste busca/índice
            antes de atribuir o erro ao gerador.'
        item_origem: P03
        responde_a: P03
        assunto: 04_avaliacao_recuperacao_resposta
