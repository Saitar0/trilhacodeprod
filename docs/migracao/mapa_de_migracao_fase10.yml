          seletor: '### Atividade 1 — Criar dois estudos de caso de projeto'
          linha_inicio: 51
          linha_fim: 55
          texto_literal: '### Atividade 1 — Criar dois estudos de caso de projeto

            Escolha dois projetos do curso. Para cada um, escreva um resumo de portfólio com público/problema, papel individual,
            escopo, arquitetura, uma decisão e alternativa, como executar/testar, evidência de resultado e limitações. Marque
            explicitamente o que foi educacional, feito em equipe ou assistido por IA. Revise o README para que uma pessoa
            externa consiga entender o projeto e executar o caminho principal com configuração de exemplo e dados sintéticos.


            **Entregável:** dois estudos de caso curtos, README atualizado para cada repositório e uma evidência (teste, demo,
            métrica ou captura sanitizada) ligada a cada afirmação.'
        item_origem: P01
        assuntos: &id212
        - 01_historia_projeto_verificavel
        - 04_selecao_apresentacao_evidencias
      KP01:
        path: 90_integracao/KP01_feedback.md
        tipo: answer_key_pratica
        arquivo_id: f10-53-1-kp01
        origem: &id223
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/53.1_Portfolio_e_presenca.md
          seletor: '**Feedback para revisar:'
          linha_inicio: 56
          linha_fim: 56
          texto_literal: '**Feedback para revisar:** cada resultado precisa apontar para evidência; cada medida precisa de
            método e contexto. Se o README omite pré-requisitos ou um passo falha em máquina limpa, atualize instruções ou
            marque a limitação. Não anuncie produção/usuários reais se o projeto é de estudo.'
        item_origem: P01
        responde_a: P01
        assuntos: *id212
      P02:
        path: 02_repositorios_leitura_execucao/P02_pratica.md
        tipo: practice
        arquivo_id: f10-53-1-p02
        origem: &id224
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/53.1_Portfolio_e_presenca.md
          seletor: '### Atividade 2 — Auditar repositório antes de compartilhar'
          linha_inicio: 58
          linha_fim: 62
          texto_literal: '### Atividade 2 — Auditar repositório antes de compartilhar

            Escolha um dos repositórios e faça uma revisão de publicação: arquivos secretos/dados, histórico, permissões,
            licença e direitos de materiais de terceiros, dependências e avisos, links/demo, instruções e dados de exemplo.
            Para cada achado, registre risco, ação e evidência de correção. Se não puder publicar, prepare uma cópia sanitizada
            ou mantenha privado e explique como demonstraria o trabalho com autorização.


            **Entregável:** checklist preenchido, lista de alterações e declaração curta do que pode ser compartilhado e sob
            quais condições.'
        item_origem: P02
        assunto: 02_repositorios_leitura_execucao
      KP02:
        path: 02_repositorios_leitura_execucao/KP02_feedback.md
        tipo: answer_key_pratica
        arquivo_id: f10-53-1-kp02
        origem: &id225
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/53.1_Portfolio_e_presenca.md
          seletor: '**Feedback para revisar:'
          linha_inicio: 63
          linha_fim: 63
          texto_literal: '**Feedback para revisar:** apagar `.env` do diretório atual não basta se uma chave real foi exposta;
            rotacione-a. Não publique dump ou screenshot com dados de terceiros. Licença de código não resolve direitos de
            dados/imagens; se houver dúvida, remova o material ou solicite orientação apropriada.'
        item_origem: P02
        responde_a: P02
        assunto: 02_repositorios_leitura_execucao
      P03:
        path: 03_curriculo_perfil_evidencias/P03_pratica.md
        tipo: practice
        arquivo_id: f10-53-1-p03
        origem: &id226
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/53.1_Portfolio_e_presenca.md
          seletor: '### Atividade 3 — Adaptar currículo e perfil a uma vaga'
          linha_inicio: 65
          linha_fim: 69
          texto_literal: '### Atividade 3 — Adaptar currículo e perfil a uma vaga

            Escolha uma vaga real ou um anúncio de exercício. Extraia até cinco competências relevantes e associe cada uma
            a projeto/evidência e limite. Escreva três bullets de currículo usando ação, contexto e resultado verificável.
            Revise headline/sobre/itens destacados de perfil (ou redija uma versão privada sem publicar) para manter consistência
            com os projetos e sua experiência real. Peça a uma pessoa revisora que aponte afirmações sem evidência.


            **Entregável:** matriz vaga → competência → artefato → evidência/limite, três bullets e rascunho de perfil com
            alterações justificadas.'
        item_origem: P03
        assunto: 03_curriculo_perfil_evidencias
      KP03:
        path: 03_curriculo_perfil_evidencias/KP03_feedback.md
        tipo: answer_key_pratica
        arquivo_id: f10-53-1-kp03
        origem: &id227
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/53.1_Portfolio_e_presenca.md
          seletor: '**Feedback para revisar:'
          linha_inicio: 70
          linha_fim: 70
          texto_literal: '**Feedback para revisar:** palavras-chave só permanecem quando correspondem a uma capacidade demonstrada.
            Separe emprego de projeto de curso, autoria própria de equipe e protótipo de produção. Se um número não tem método,
            retire-o ou descreva a observação qualitativamente.'
        item_origem: P03
        responde_a: P03
        assunto: 03_curriculo_perfil_evidencias
