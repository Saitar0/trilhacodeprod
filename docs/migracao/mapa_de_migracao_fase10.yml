          linha_inicio: 55
          linha_fim: 59
          texto_literal: '### Atividade 1 — Criar um modelo de ameaças

            Escolha uma funcionalidade RAG ou tool-calling do projeto. Desenhe seus componentes e fronteiras de confiança.
            Liste ativos e atores, incluindo pessoa usuária, operador, provedor, ferramenta e fonte externa. Preencha uma
            tabela de ameaças com ao menos cinco caminhos, incluindo documento malicioso, acesso entre tenants, segredo em
            log, ação fora do escopo e risco da integração externa/MCP se usada. Se não usa MCP, marque como fora do escopo
            e justifique.


            **Entregável:** diagrama e registro com caminho, impacto, probabilidade/exposição contextual, controle atual,
            evidência e risco residual.'
