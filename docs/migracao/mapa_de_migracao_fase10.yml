          seletor: '### Atividade 2 — Maior soma em intervalo contíguo (independente)'
          linha_inicio: 67
          linha_fim: 77
          texto_literal: '### Atividade 2 — Maior soma em intervalo contíguo (independente)

            **Contexto e objetivo:** resolver um caso em que a solução quadrática simples pode ser substituída por uma varredura
            linear.


            **Dados iniciais:** lista não vazia `[-2, 3, -1, 4, -5]`. Encontre a maior soma de um intervalo contíguo e retorne
            também os índices inicial e final. Para este exemplo, uma resposta válida é soma `6`, intervalo de índice `1`
            a `3` (`[3, -1, 4]`).


            **Instruções:** primeiro descreva a força bruta que calcula cada intervalo e seu custo. Em seguida, proponha uma
            varredura que mantém a melhor soma de intervalo terminando na posição atual e a melhor soma global. Defina como
            desempatar se vários intervalos tiverem a mesma soma. Teste também lista de um elemento negativo e lista com todos
            os números negativos.


            **Entrega:** pseudocódigo/implementação, breve justificativa da propriedade mantida, resultado e índices dos testes,
            complexidades e regra de desempate.


            **Dica gradual:** ao chegar ao próximo número, compare começar um novo intervalo ali ou estender o intervalo anterior.
            Não inicialize a melhor soma em zero se a tarefa exige intervalo não vazio e todos os valores podem ser negativos.'
        item_origem: P02
        assunto: 03_complexidade_e_correcao
      KP02:
        path: 03_complexidade_e_correcao/KP02_feedback.md
        tipo: answer_key_pratica
        arquivo_id: f10-53-4-kp02
        origem: &id309
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/53.4_Algoritmos_para_entrevistas_tecnicas.md
          seletor: '**Feedback e erro comum:'
          linha_inicio: 78
          linha_fim: 78
          texto_literal: '**Feedback e erro comum:** a varredura conhecida como algoritmo de Kadane resolve em O(n) tempo
            e O(1) espaço auxiliar, se só precisa retornar soma/índices. Erro comum: zerar a soma corrente e devolver zero
            para uma entrada em que todos os elementos são negativos.'
        item_origem: P02
        responde_a: P02
        assunto: 03_complexidade_e_correcao
      P03:
        path: 90_integracao/P03_pratica.md
        tipo: practice
        arquivo_id: f10-53-4-p03
        origem: &id310
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/53.4_Algoritmos_para_entrevistas_tecnicas.md
          seletor: '### Atividade 3 — Depurar busca binária (transferência)'
          linha_inicio: 80
          linha_fim: 105
          texto_literal: "### Atividade 3 — Depurar busca binária (transferência)\n**Contexto e objetivo:** encontrar erro\
            \ de limite, criar testes que o exponham e explicar precondições.\n\n**Código com falha (pseudocódigo):**\n\n\
            ```text\nfuncao buscar(a, alvo):\n    esquerda = 0\n    direita = tamanho(a)\n    enquanto esquerda < direita:\n\
            \        meio = (esquerda + direita) // 2\n        se a[meio] == alvo:\n            retornar meio\n        se\
            \ a[meio] < alvo:\n            esquerda = meio\n        senao:\n            direita = meio\n    retornar -1\n\
            ```\n\n**Instruções:** identifique pelo menos dois problemas possíveis; crie o menor teste que não termina ou\
            \ retorna resultado incorreto; corrija os limites mantendo um intervalo coerente; teste alvo presente, ausente,\
            \ primeiro/último elemento, lista vazia e duplicatas. Declare se qualquer índice correspondente serve quando houver\
            \ mais de uma ocorrência.\n\n**Entrega:** descrição dos bugs, versão corrigida, tabela de testes e explicação\
            \ da invariante dos limites.\n\n**Dica gradual:** o limite direito inicial não pode ser usado como índice válido\
            \ nesse código; além disso, atribuir `esquerda = meio` pode deixar o intervalo igual quando há dois candidatos.\
            \ Escolha intervalos fechado `[esquerda, direita]` ou semiaberto `[esquerda, direita)` e atualize todos os passos\
            \ de forma consistente."
        item_origem: P03
        assuntos: &id296
