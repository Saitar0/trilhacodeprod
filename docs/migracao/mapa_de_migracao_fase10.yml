          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/48.2_Operacao.md
          seletor: '### Atividade 2 — Implementar e provocar falhas'
          linha_inicio: 58
          linha_fim: 62
          texto_literal: '### Atividade 2 — Implementar e provocar falhas

            Adicione streaming por SSE ao app, com autenticação conforme o projeto, estados da interface e um mecanismo de
            cancelamento. Use um provedor simulado ou mock para produzir: resposta normal, erro antes do primeiro fragmento,
            erro após alguns fragmentos, atraso acima do timeout e cancelamento. Depois, se autorizado e com dados sintéticos,
            teste uma chamada real sob limite de uso. Verifique também se o ambiente local entrega fragmentos sem buffering
            inesperado.


            **Entregável:** diff da rota/cliente/interface, testes ou roteiro reproduzível dos cenários, evidência dos estados
            observados e descrição do que o cancelamento realmente interrompe.'
        item_origem: P02
        assuntos: &id063
        - 01_streaming_contrato_eventos
        - 02_estados_saida_parcial
        - 03_cancelamento_timeout_falhas
      KP02:
        path: 90_integracao/KP02_feedback.md
        tipo: answer_key_pratica
        arquivo_id: f10-48-2-kp02
        origem: &id076
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/48.2_Operacao.md
          seletor: '**Feedback para revisar:'
          linha_inicio: 63
          linha_fim: 63
          texto_literal: '**Feedback para revisar:** a resposta precisa terminar em estado terminal em todos os casos; streams
            e recursos devem ser fechados; erro não pode ser escondido nem transformado em conclusão normal. Identifique claramente
            cenários simulados e reais e não afirme interrupção do provedor sem evidência.'
        item_origem: P02
        responde_a: P02
        assuntos: *id063
