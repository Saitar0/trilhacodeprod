        origem: &id045
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/48.1_Fundamentos.md
          seletor: '**Feedback para revisar:'
          linha_inicio: 58
          linha_fim: 58
          texto_literal: '**Feedback para revisar:** o caso está delimitado se outra pessoa consegue classificar uma saída
            como aceitável sem inventar requisitos. Se a rubrica diz apenas “resposta boa”, defina propriedades observáveis:
            informação necessária presente, formato válido, ausência de dado não fornecido e conduta para falta de evidência.'
        item_origem: P01
        responde_a: P01
        assunto: 03_avaliacao_tarefa_modelo
