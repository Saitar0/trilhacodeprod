          linha_inicio: 56
          linha_fim: 64
          texto_literal: '### Atividade 1 — Apresentação de projeto

            **Contexto e objetivo:** use o projeto documentado em 53.1 para explicar uma experiência técnica de forma verificável.


            **Instruções:** escreva uma versão de até dois minutos em inglês com problema, público, seu papel, decisão, evidência
            e limitação. Grave o áudio ou faça uma apresentação oral para uma pessoa. Depois responda a duas perguntas de
            acompanhamento, incluindo uma sobre uma métrica ou trade-off. Não use informação confidencial.


            **Entrega:** roteiro curto, gravação privada ou registro das respostas e uma lista de duas revisões feitas.


            **Dica gradual:** comece com cinco tópicos, não com um texto completo; use conectores simples como “The main constraint
            was…” e “The trade-off was…”.'
        item_origem: P01
        assunto: 02_apresentacao_de_projetos
