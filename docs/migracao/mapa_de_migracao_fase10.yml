        arquivo_id: f10-51-1-kp01
        origem: &id159
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/51.1_Seguranca_e_governanca.md
          seletor: '**Feedback para revisar:'
          linha_inicio: 60
          linha_fim: 60
          texto_literal: '**Feedback para revisar:** ameaças precisam ser caminhos concretos ligados a um ativo e impacto;
            “IA pode errar” não basta. Identifique onde a confiança é concedida e quem a valida. Não inclua segredo ou dado
            pessoal real no artefato.'
        item_origem: P01
        responde_a: P01
        assuntos: *id147
      P02:
        path: 90_integracao/P02_pratica.md
        tipo: practice
        arquivo_id: f10-51-1-p02
        origem: &id160
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/51.1_Seguranca_e_governanca.md
          seletor: '### Atividade 2 — Implementar e verificar controles'
          linha_inicio: 62
          linha_fim: 66
          texto_literal: '### Atividade 2 — Implementar e verificar controles

            Escolha três ameaças prioritárias. Proponha controles no sistema e demonstre pelo menos dois com testes ou cenários
            reproduzíveis: tentativa de acesso a outro tenant, prompt injection em documento, argumento de ferramenta fora
            da faixa, conteúdo sensível em erro/log ou destino URL não permitido. Para cada cenário, registre resultado esperado
            e observado; inclua um caso legítimo que não deve ser bloqueado para avaliar falso positivo.


            **Entregável:** matriz ameaça → controle → teste/evidência, diff ou configuração do controle e resultados sanitizados.'
        item_origem: P02
        assuntos: &id148
        - 02_entradas_recuperacao_saidas_nao_confiaveis
        - 03_ferramentas_mcp_efeitos
      KP02:
        path: 90_integracao/KP02_feedback.md
        tipo: answer_key_pratica
        arquivo_id: f10-51-1-kp02
        origem: &id161
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/51.1_Seguranca_e_governanca.md
          seletor: '**Feedback para revisar:'
          linha_inicio: 67
          linha_fim: 67
          texto_literal: '**Feedback para revisar:** um prompt “ignore ataques” não conta como controle suficiente. O teste
            deve demonstrar que a camada do servidor bloqueia a ação/acesso. Registre tanto bloqueios corretos quanto falhas
            e falsos positivos; se um controle só foi proposto e não exercitado, marque como pendente.'
        item_origem: P02
        responde_a: P02
        assuntos: *id148
      P03:
        path: 04_dados_governanca_incidentes/P03_pratica.md
        tipo: practice
        arquivo_id: f10-51-1-p03
        origem: &id162
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/51.1_Seguranca_e_governanca.md
          seletor: '### Atividade 3 — Registrar governança e resposta'
          linha_inicio: 69
          linha_fim: 73
          texto_literal: '### Atividade 3 — Registrar governança e resposta

            Faça um inventário dos dados processados pelo fluxo, incluindo origem, categoria, finalidade, necessidade, provedor/destino,
            acesso, logs, retenção e exclusão. Escreva um procedimento curto para vazamento de dados ou ação não autorizada:
            contenção, credenciais, investigação, comunicação interna e decisão sobre desligar a integração. Registre responsáveis
            e pontos que precisam de revisão jurídica/privacidade.


            **Entregável:** ficha de governança de dados e roteiro de resposta a incidente com riscos residuais e responsáveis.'
        item_origem: P03
        assunto: 04_dados_governanca_incidentes
      KP03:
        path: 04_dados_governanca_incidentes/KP03_feedback.md
        tipo: answer_key_pratica
        arquivo_id: f10-51-1-kp03
        origem: &id163
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/51.1_Seguranca_e_governanca.md
          seletor: '**Feedback para revisar:'
          linha_inicio: 74
          linha_fim: 74
          texto_literal: '**Feedback para revisar:** cada dado deve ter finalidade e prazo/critério de retenção explicados.
            “Não guardar nada” só é válido se o fluxo realmente não persiste conteúdo; metadados e logs também podem ser dados.
            Não declare conformidade legal com base apenas nesta atividade.'
        item_origem: P03
        responde_a: P03
        assunto: 04_dados_governanca_incidentes
      R00:
        path: 90_integracao/R00_rubrica_praticas.md
        tipo: rubric
        arquivo_id: f10-51-1-r00
        origem: &id164
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/51.1_Seguranca_e_governanca.md
          seletor: '## Prática > Rubrica (0–4)'
          linha_inicio: 76
          linha_fim: 76
          texto_literal: '**Rubrica (0–4):** ativos/fronteiras e caminhos de ameaça (0–1); controle determinístico testado
            (0–1); ferramenta/integração limitada e auditável (0–1); dados, retenção e incidente com responsáveis (0–1).'
        escala_rubrica: 0–4
        aplica_a:
        - P01
        - P02
        - P03
