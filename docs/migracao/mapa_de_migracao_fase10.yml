          seletor: '### Atividade 1 — Desenhar o ciclo de vida do stream'
          linha_inicio: 51
          linha_fim: 55
          texto_literal: '### Atividade 1 — Desenhar o ciclo de vida do stream

            Para um formulário de geração de resposta, desenhe estados e transições para envio, primeiro fragmento, novos
            fragmentos, conclusão, erro antes/depois do início e cancelamento. Defina um contrato de eventos da aplicação
            com ID de requisição e resultado final explícito. Indique o que aparece para a pessoa usuária em cada estado.


            **Entregável:** diagrama de estados ou tabela com evento recebido, estado atual, próximo estado e comportamento
            da interface.'
        item_origem: P01
        assuntos: &id062
        - 01_streaming_contrato_eventos
        - 02_estados_saida_parcial
      KP01:
        path: 90_integracao/KP01_feedback.md
        tipo: answer_key_pratica
