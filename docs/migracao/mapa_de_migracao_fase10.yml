          seletor: '### Atividade 1 — Definir o caso e o protocolo de avaliação'
          linha_inicio: 53
          linha_fim: 57
          texto_literal: '### Atividade 1 — Definir o caso e o protocolo de avaliação

            Escolha uma função de baixo risco para uma aplicação de estudo, como resumir texto sintético ou classificar uma
            solicitação fictícia. Especifique usuário, entrada permitida, resposta esperada, casos que devem ser recusados/esclarecidos
            e dados que não devem sair da aplicação. Crie de 6 a 10 exemplos representativos e uma rubrica de avaliação antes
            de chamar qualquer modelo.


            **Entregável:** ficha do caso de uso, conjunto de exemplos sintéticos e critérios de avaliação com pelo menos
            um caso ambíguo e um fora do escopo.'
        item_origem: P01
        assunto: 03_avaliacao_tarefa_modelo
      KP01:
        path: 03_avaliacao_tarefa_modelo/KP01_feedback.md
        tipo: answer_key_pratica
