      M01:
        path: 11_problema_baseline_e_decisao_de_ia.md
        tipo: project_milestone
        arquivo_id: f10-52-1-m01
        origem: &id177
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/52.1_Estrutura_do_projeto_final.md
          seletor: '### Entrega 1 — Problema, baseline e decisão de IA'
          linha_inicio: 23
          linha_fim: 25
          titulo_marco_literal: Problema, baseline e decisão de IA
          texto_literal: '### Entrega 1 — Problema, baseline e decisão de IA

            Atualize README com público, problema, fluxo atual e objetivo. Registre uma linha de base: que resultado é observado
            hoje e como saber se houve melhoria. Escolha uma capacidade de IA que responda à necessidade ou registre experimento
            separado. Escreva critérios de aceite, casos que devem falhar/abster-se e um conjunto inicial de avaliação. Desenhe
            arquitetura atual e proposta, fluxos de dados, fronteiras de confiança e componentes reutilizados das fases anteriores.
            Registre ADR com contexto, alternativas, decisão, consequências e riscos.'
        titulo_marco: Problema, baseline e decisão de IA
      C01:
        path: 21_aceite_problema_baseline_e_decisao_de_ia.md
        tipo: checklist
        arquivo_id: f10-52-1-c01
        origem: &id178
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/52.1_Estrutura_do_projeto_final.md
          seletor: '**Critérios de aceite:**'
          linha_inicio: 26
          linha_fim: 26
          titulo_marco_literal: Problema, baseline e decisão de IA
          texto_literal: '**Critérios de aceite:** problema e público são específicos; benefício é mensurável ou há hipótese
            explícita; escopo é executável; critérios podem ser avaliados; ADR explica por que IA e componentes escolhidos
            fazem sentido. Dados e provedor foram avaliados para o cenário.'
        titulo_marco: Problema, baseline e decisão de IA
        marco_ref: M01
      M02:
        path: 12_fatia_vertical_funcional_e_segura.md
        tipo: project_milestone
        arquivo_id: f10-52-1-m02
        origem: &id179
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/52.1_Estrutura_do_projeto_final.md
          seletor: '### Entrega 2 — Fatia vertical funcional e segura'
          linha_inicio: 32
          linha_fim: 34
          titulo_marco_literal: Fatia vertical funcional e segura
          texto_literal: '### Entrega 2 — Fatia vertical funcional e segura

            Implemente um fluxo ponta a ponta pequeno no projeto existente: ação na interface, endpoint/backend, dados autorizados
            e resposta para usuário. Integre o modelo por uma fronteira do servidor. Valide autorização em cada acesso e ferramenta;
            valide saída no contrato da aplicação; aplique autenticação, limites e tratamento de erro. Para RAG, preserve
            origem/permissão e cite trechos recuperados; para tool calling, limite operações, parâmetros e efeitos. Inclua
            estados de carregamento, erro, parcial/cancelado quando houver streaming e alternativa clara quando o provedor
            falhar.'
        titulo_marco: Fatia vertical funcional e segura
      C02:
        path: 22_aceite_fatia_vertical_funcional_e_segura.md
        tipo: checklist
        arquivo_id: f10-52-1-c02
        origem: &id180
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/52.1_Estrutura_do_projeto_final.md
          seletor: '**Critérios de aceite:**'
          linha_inicio: 35
          linha_fim: 35
          titulo_marco_literal: Fatia vertical funcional e segura
          texto_literal: '**Critérios de aceite:** o fluxo normal é reproduzível; usuários não acessam dados de outros escopos;
            conteúdo/saída hostil não vira instrução privilegiada; o resultado e as limitações ficam claros; fluxo usa projeto
            acumulado, sem reconstrução artificial.'
        titulo_marco: Fatia vertical funcional e segura
        marco_ref: M02
      M03:
        path: 13_qualidade_seguranca_e_operacao.md
        tipo: project_milestone
        arquivo_id: f10-52-1-m03
        origem: &id181
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/52.1_Estrutura_do_projeto_final.md
          seletor: '### Entrega 3 — Qualidade, segurança e operação'
          linha_inicio: 41
          linha_fim: 45
          titulo_marco_literal: Qualidade, segurança e operação
          texto_literal: '### Entrega 3 — Qualidade, segurança e operação

            Amplie o conjunto de avaliação com casos cobertos, sem resposta, ambíguos, conflitantes e de abuso aplicáveis
            à funcionalidade. Avalie qualidade da saída, fundamentação/citação quando houver RAG, autorização e casos de erro;
            registre análise humana de uma amostra. Adicione testes e verificações relevantes, tratamento de falha, proteção
            contra repetição/efeitos, limites de chamadas/volume, timeout e políticas de retenção. Meça latência, falhas e
            custo/unidade de uso sem registrar conteúdo sensível por padrão.


            Prepare a CI/CD e empacotamento em Docker do projeto. Inclua observabilidade que correlacione o caminho sem vazar
            dados, procedimento de resposta a falha e orçamento/limite operacional inicial. Simule ao menos uma falha relevante
            e registre resultado e correção.'
        titulo_marco: Qualidade, segurança e operação
      C03:
        path: 23_aceite_qualidade_seguranca_e_operacao.md
        tipo: checklist
        arquivo_id: f10-52-1-c03
        origem: &id182
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/52.1_Estrutura_do_projeto_final.md
          seletor: '**Critérios de aceite:**'
          linha_inicio: 46
          linha_fim: 46
          titulo_marco_literal: Qualidade, segurança e operação
          texto_literal: '**Critérios de aceite:** critérios de qualidade são explícitos e reproduzíveis; controles críticos
            têm teste; pipeline verifica build/teste e implanta a versão esperada; métricas apoiam decisões sobre latência,
            falha e custo; limitações e riscos residuais estão documentados.'
        titulo_marco: Qualidade, segurança e operação
        marco_ref: M03
      M04:
        path: 14_deploy_demonstravel_documentacao_e_aceite.md
        tipo: project_milestone
        arquivo_id: f10-52-1-m04
        origem: &id183
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/52.1_Estrutura_do_projeto_final.md
          seletor: '### Entrega 4 — Deploy demonstrável, documentação e aceite'
          linha_inicio: 52
          linha_fim: 54
          titulo_marco_literal: Deploy demonstrável, documentação e aceite
          texto_literal: '### Entrega 4 — Deploy demonstrável, documentação e aceite

            Prepare infraestrutura com Terraform para um ambiente AWS isolado de demonstração, configuração sem segredos no
            código, permissões mínimas e limites de gasto/recursos adequados. Execute o deploy, valide o fluxo e a observabilidade
            no ambiente alvo e registre como destruir os recursos de teste. Revise diagrama e README para outra pessoa conseguir
            configurar, executar, testar, implantar e investigar o projeto. Faça revisão final contra a rubrica.'
        titulo_marco: Deploy demonstrável, documentação e aceite
      C04:
        path: 24_aceite_deploy_demonstravel_documentacao_e_aceite.md
        tipo: checklist
        arquivo_id: f10-52-1-c04
        origem: &id184
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/52.1_Estrutura_do_projeto_final.md
          seletor: '**Critérios de aceite:**'
          linha_inicio: 55
          linha_fim: 55
          titulo_marco_literal: Deploy demonstrável, documentação e aceite
          texto_literal: '**Critérios de aceite:** ambiente alvo está descrito e foi implantado; secrets/configuração são
            externos ao repositório; a aplicação pode ser verificada por roteiro; custos e recursos de demonstração são limitados;
            README, diagrama, ADR, avaliação, testes, CI/CD e limitações estão atualizados.'
        titulo_marco: Deploy demonstrável, documentação e aceite
        marco_ref: M04
      CHK:
        path: 90_checklist_final.md
        tipo: checklist
        arquivo_id: f10-52-1-chk
        origem: &id185
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/52.1_Estrutura_do_projeto_final.md
          seletor: '## Checklist de aceitação'
          linha_inicio: 61
          linha_fim: 72
          itens: 10
          texto_literal: '## Checklist de aceitação

            - [ ] Funcionalidade full stack com IA ligada a uma necessidade demonstrável ou experimento separado claramente
            marcado.

            - [ ] Frontend React e backend estruturado no projeto acumulado.

            - [ ] Banco relacional; cache e fila quando justificados pelo produto ou documentados como experimento.

            - [ ] Docker, testes e CI/CD com evidência de execução.

            - [ ] Deploy AWS demonstrável e infraestrutura Terraform.

            - [ ] Observabilidade para erros, latência e custo/uso de IA, sem exposição desnecessária de conteúdo.

            - [ ] README com execução, arquitetura, limitações, segurança e decisões.

            - [ ] Diagrama de arquitetura atualizado.

            - [ ] Continuidade do projeto acumulado, sem recomeçar do zero.

            - [ ] Teardown/limpeza do ambiente de demonstração documentado.'
        quantidade_itens: 10
      R00:
        path: 91_rubrica_final.md
        tipo: rubric
        arquivo_id: f10-52-1-r00
        origem: &id186
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/52.1_Estrutura_do_projeto_final.md
          seletor: '## Rubrica final'
          linha_inicio: 73
          linha_fim: 88
          dimensoes: 8
          texto_literal: '## Rubrica final

            Atribua 0, 1 ou 2 por critério. Aceite somente com pelo menos 13/16 pontos e nenhum zero nos critérios de produto,
            segurança, avaliação ou deploy; itens ainda não demonstrados permanecem pendentes mesmo quando a soma alcança
            o limiar.


            | Critério | 0 — ausente | 1 — parcial | 2 — evidência suficiente |

            |---|---|---|---|

            | Continuidade e problema | projeto reiniciado ou necessidade não descrita | continuidade/problema parcial | evolução
            do Trilho A e problema/público claros |

            | Escolha e avaliação de IA | IA sem necessidade ou sem critério | hipótese/casos incompletos | decisão justificada
            e avaliação reproduzível |

            | Fluxo vertical | caminho ponta a ponta ausente | fluxo funciona com lacunas de estado/erro | interface, backend
            e dados integrados com evidência |

            | Segurança e privacidade | autorização/segredo/dados sem controle | controles presentes sem cenários críticos
            | fronteiras, autorização, minimização e falhas verificados |

            | Testes e confiabilidade | sem testes úteis | testes parciais ou integração não comprovada | comportamento normal,
            erro e limites cobertos por evidência adequada |

            | Operação e observabilidade | sem medidas ou resposta | sinais ou procedimentos incompletos | falhas, latência
            e custo observáveis com runbook e limites |

            | CI/CD e deploy | pipeline/deploy não demonstrados | execução parcial ou manual sem registro | pipeline e deploy
            AWS/Terraform demonstrados e repetíveis |

            | Documentação e decisões | README/diagrama/ADR ausentes | documentação desatualizada/incompleta | execução, arquitetura,
            trade-offs, limitações e teardown claros |


            **Interpretação:** 13–16 pontos com os critérios obrigatórios sem zero: pronto para aceite da fase; 9–12 pontos
            ou qualquer pendência crítica: corrigir e reapresentar; 0–8: retomar os marcos necessários. A rubrica não substitui
            os critérios do projeto nem declara experiência profissional ou senioridade.'
        escala_rubrica: 0–2
        dimensoes: 8
        total: 16
