          seletor: '### Atividade 1 — Especificar uma ferramenta de leitura'
          linha_inicio: 51
          linha_fim: 55
          texto_literal: '### Atividade 1 — Especificar uma ferramenta de leitura

            Desenhe a ferramenta `consultar_pedido` ou `listar_tarefas` para responder apenas a dados do usuário autenticado.
            Defina finalidade, parâmetros, limites, saída mínima, erros esperados e o que será derivado da sessão. Inclua
            exemplos de chamada válida, inválida e tentativa de acessar outro usuário/tenant.


            **Entregável:** contrato JSON/schema ou tabela equivalente, exemplos e sequência do ciclo de tool calling.'
        item_origem: P01
        assuntos: &id119
        - 01_ciclo_tool_calling
        - 02_contratos_minimos_validacao
      KP01:
        path: 90_integracao/KP01_feedback.md
        tipo: answer_key_pratica
        arquivo_id: f10-50-1-kp01
        origem: &id130
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/50.1_Orquestracao.md
          seletor: '**Feedback para revisar:'
          linha_inicio: 56
          linha_fim: 56
          texto_literal: '**Feedback para revisar:** não inclua identidade/tenant como argumento confiável se pode derivá-los
            da sessão. O contrato deve impedir entradas obviamente inválidas, mas mostre também a validação de domínio e acesso
            que acontece no backend.'
        item_origem: P01
        responde_a: P01
        assuntos: *id119
      P02:
        path: 03_autorizacao_e_efeitos/P02_pratica.md
        tipo: practice
        arquivo_id: f10-50-1-p02
        origem: &id131
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/50.1_Orquestracao.md
          seletor: '### Atividade 2 — Implementar validação e autorização'
          linha_inicio: 58
          linha_fim: 62
          texto_literal: '### Atividade 2 — Implementar validação e autorização

            Implemente a ferramenta de leitura no backend com menor privilégio. Valide argumentos e estado, derive identidade
            da sessão e limite campos e quantidade retornados. Exercite entrada malformada, ID inexistente, usuário sem acesso
            e resultado que contenha texto hostil. Verifique que falhas não revelam existência de dados protegidos nem segredos.
            Esboce como uma futura ferramenta de escrita exigiria confirmação específica e idempotência.


            **Entregável:** diff, testes automatizados ou roteiro reproduzível para os cenários e uma nota sobre dados/erros
            expostos.'
        item_origem: P02
        assunto: 03_autorizacao_e_efeitos
      KP02:
        path: 03_autorizacao_e_efeitos/KP02_feedback.md
        tipo: answer_key_pratica
        arquivo_id: f10-50-1-kp02
        origem: &id132
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/50.1_Orquestracao.md
          seletor: '**Feedback para revisar:'
          linha_inicio: 63
          linha_fim: 63
          texto_literal: '**Feedback para revisar:** toda chamada deve atravessar a checagem de autorização mesmo se o modelo
            escolheu a ferramenta. O teste de usuário/tenant alheio precisa falhar sem retornar o registro. Não use uma função
            genérica de SQL/HTTP como atalho.'
        item_origem: P02
        responde_a: P02
        assunto: 03_autorizacao_e_efeitos
      P03:
        path: 04_orquestracao_framework/P03_pratica.md
        tipo: practice
        arquivo_id: f10-50-1-p03
        origem: &id133
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/50.1_Orquestracao.md
          seletor: '### Atividade 3 — Comparar fluxo direto e framework'
          linha_inicio: 65
          linha_fim: 69
          texto_literal: '### Atividade 3 — Comparar fluxo direto e framework

            Escolha um caso com duas ou três etapas previsíveis. Modele primeiro com fluxo direto explícito. Depois avalie
            um framework listado na trilha (ou um exemplo fornecido) para a mesma necessidade. Compare comportamento em sucesso,
            erro, repetição/loop, limite de chamadas, rastreabilidade e custo de manutenção. Se não implementar uma das opções,
            marque os resultados dessa opção como análise documental, não medição executada.


            **Entregável:** diagrama de fluxo, matriz de comparação e recomendação com necessidade concreta, custo e risco.'
        item_origem: P03
        assunto: 04_orquestracao_framework
      KP03:
        path: 04_orquestracao_framework/KP03_feedback.md
        tipo: answer_key_pratica
        arquivo_id: f10-50-1-kp03
        origem: &id134
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/50.1_Orquestracao.md
          seletor: '**Feedback para revisar:'
          linha_inicio: 70
          linha_fim: 70
          texto_literal: '**Feedback para revisar:** não conclua que o framework é melhor apenas por oferecer mais abstrações,
            nem que o fluxo direto é sempre suficiente. Baseie a escolha em requisitos observados e inclua o que teria de
            ser construído/operado em cada opção. Em ambas, autorização permanece no backend.'
        item_origem: P03
        responde_a: P03
        assunto: 04_orquestracao_framework
