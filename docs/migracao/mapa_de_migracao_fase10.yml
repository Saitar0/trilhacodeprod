          seletor: '## Prática > Rubrica (0–4)'
          linha_inicio: 89
          linha_fim: 89
          texto_literal: '**Rubrica (0–4) para cada atividade:** contexto e resposta à pergunta (0–1); estrutura e contribuição
            própria (0–1); precisão, evidência e reconhecimento de limites (0–1); revisão baseada em feedback específico (0–1).
            Avalie inteligibilidade e correção da mensagem, não semelhança com sotaque nativo.'
        escala_rubrica: 0–4
