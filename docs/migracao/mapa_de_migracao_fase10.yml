        origem: &id277
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/53.3_System_design.md
          seletor: '### Atividade 1 — Requisitos e estimativa de um encurtador de URLs'
          linha_inicio: 52
          linha_fim: 62
          texto_literal: '### Atividade 1 — Requisitos e estimativa de um encurtador de URLs

            **Contexto e objetivo:** praticar clarificação, estimativa dimensional e delimitação antes de desenhar componentes.


            **Dados iniciais:** cenário didático com 100 mil usuários ativos/dia; cada usuário cria 2 URLs e acessa 20 URLs
            por dia. Considere, apenas para a conta inicial, 500 bytes de metadados por URL e retenção de 365 dias. Não foram
            informados fator de pico, overhead de índice nem crescimento futuro.


            **Instruções:** escreva cinco perguntas de requisito; classifique pelo menos dois requisitos funcionais e dois
            não funcionais; calcule criações/leitura por dia, taxa média e armazenamento bruto anual de metadados. Declare
            o que está fora da conta e proponha uma faixa ou hipótese de pico, sem tratá-la como fato.


            **Entrega:** tabela de requisitos e cálculos com unidades, hipóteses e exclusões.


            **Dica gradual:** converta usuários × ações/usuário em ações/dia; divida por 86.400 para média por segundo; para
            armazenamento, multiplique URLs criadas/dia × 500 bytes × 365 dias.'
        item_origem: P01
        assuntos: &id267
        - 01_requisitos_e_delimitacao
        - 02_estimativas_ordem_grandeza
      KP01:
        path: 90_integracao/KP01_feedback.md
        tipo: answer_key_pratica
        arquivo_id: f10-53-3-kp01
        origem: &id278
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/53.3_System_design.md
          seletor: '**Verificação e erro comum:'
          linha_inicio: 63
          linha_fim: 63
          texto_literal: '**Verificação e erro comum:** os dados dão 200 mil criações/dia (≈2,3/s), 2 milhões de redirecionamentos/dia
            (≈23/s) e 36,5 GB brutos de metadados/ano, antes de índices, réplicas e overhead. Erro comum: chamar a média de
            pico ou esconder premissas sobre payload e retenção.'
        item_origem: P01
        responde_a: P01
        assuntos: *id267
      P02:
        path: 03_baseline_fluxo_dados/P02_pratica.md
        tipo: practice
        arquivo_id: f10-53-3-p02
        origem: &id279
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/53.3_System_design.md
          seletor: '### Atividade 2 — Desenho mínimo e evolução justificada'
          linha_inicio: 65
          linha_fim: 73
          texto_literal: '### Atividade 2 — Desenho mínimo e evolução justificada

            **Contexto e objetivo:** propor um caminho de leitura e escrita coerente com os requisitos definidos na Atividade
            1.


            **Instruções:** desenhe cliente, API, armazenamento e geração de identificador; descreva endpoints ou operações
            de criar e redirecionar URL, dados mínimos e índices. Depois responda a duas mudanças: (a) leitura cresce muito
            mais que escrita; (b) o serviço de resolução depende de uma API externa lenta. Só acrescente cache, fila, CDN
            ou isolamento de serviço se justificar requisito, benefício e novo modo de falha.


            **Entrega:** diagrama simples, descrição do fluxo de criação/redirecionamento e tabela “mudança → decisão → trade-off”.


            **Dica gradual:** siga a requisição e os dados antes de escolher infraestrutura. Para cada componente, complete:
            “adiciono ___ porque ___; agora preciso tratar ___”.'
        item_origem: P02
        assunto: 03_baseline_fluxo_dados
      KP02:
        path: 03_baseline_fluxo_dados/KP02_feedback.md
        tipo: answer_key_pratica
        arquivo_id: f10-53-3-kp02
        origem: &id280
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/53.3_System_design.md
          seletor: '**Feedback e erro comum:'
          linha_inicio: 74
          linha_fim: 74
          texto_literal: '**Feedback e erro comum:** o desenho deve explicar colisão/único identificador, destino não encontrado,
            dependência lenta e comportamento do cache se houver. Erro comum: adicionar tecnologias sem explicar o fluxo ou
            o que acontece quando elas falham.'
        item_origem: P02
        responde_a: P02
        assunto: 03_baseline_fluxo_dados
      P03:
        path: 04_falhas_operacao_tradeoffs/P03_pratica.md
        tipo: practice
        arquivo_id: f10-53-3-p03
        origem: &id281
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/53.3_System_design.md
          seletor: '### Atividade 3 — Revisão de falhas e defesa do desenho'
          linha_inicio: 76
          linha_fim: 84
          texto_literal: '### Atividade 3 — Revisão de falhas e defesa do desenho

            **Contexto e objetivo:** testar se a proposta continua compreensível e operável quando uma hipótese deixa de valer.


            **Instruções:** analise três incidentes: banco indisponível por 2 minutos; pico 5 vezes maior que a média assumida;
            cache retorna destino antigo após atualização. Para cada um, descreva impacto, sinal de detecção, contenção, recuperação
            e métrica/log que ajudaria. Reavalie ao menos uma decisão do diagrama e prepare uma explicação oral de até cinco
            minutos, incluindo um trade-off e uma pergunta que faria ao entrevistador.


            **Entrega:** tabela dos incidentes, desenho revisado e apresentação ou roteiro de defesa.


            **Dica gradual:** trace primeiro a requisição afetada; depois identifique o componente que falhou e o efeito visível
            ao usuário. Não presuma que retry resolve indisponibilidade.'
        item_origem: P03
        assunto: 04_falhas_operacao_tradeoffs
      KP03:
        path: 04_falhas_operacao_tradeoffs/KP03_feedback.md
        tipo: answer_key_pratica
        arquivo_id: f10-53-3-kp03
        origem: &id282
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/53.3_System_design.md
          seletor: '**Feedback e erro comum:'
          linha_inicio: 85
          linha_fim: 85
          texto_literal: '**Feedback e erro comum:** outra pessoa deve conseguir apontar onde os dados passam, qual requisito
            justifica cada componente e como o sistema degrada/recupera. Erro comum: listar alertas sem ação de contenção,
            ou prometer disponibilidade sem explicar dependências.'
        item_origem: P03
        responde_a: P03
        assunto: 04_falhas_operacao_tradeoffs
