          linha_fim: 65
          texto_literal: '**Feedback e erro comum:** confira se sua contribuição está separada da equipe e se cada métrica
            tem método e contexto. Erro comum: enumerar tecnologias sem explicar problema, escolha ou resultado.'
        item_origem: P01
        responde_a: P01
        assunto: 02_apresentacao_de_projetos
      P02:
        path: 03_experiencias_colaboracao_star/P02_pratica.md
        tipo: practice
        arquivo_id: f10-53-2-p02
        origem: &id251
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/53.2_Ingles_tecnico_e_entrevistas.md
          seletor: '### Atividade 2 — Resposta comportamental com acompanhamento'
          linha_inicio: 67
          linha_fim: 75
          texto_literal: '### Atividade 2 — Resposta comportamental com acompanhamento

            **Contexto e objetivo:** praticar uma resposta sobre conflito técnico, feedback recebido ou erro real sem transformar
            STAR em fala decorada.


            **Instruções:** escolha um episódio verdadeiro. Anote uma frase para Situation, uma para Task, duas ou três para
            Action e uma para Result/learning. Responda em inglês em até dois minutos. Em seguida, responda: “What would you
            do differently?” e “How did you know the outcome was successful?”


            **Entrega:** notas STAR, resposta oral ou transcrição e uma revisão após perguntas de acompanhamento.


            **Dica gradual:** mantenha o contexto breve e comece a parte Action com verbos concretos: “I compared…”, “I asked…”,
            “I tested…”.'
        item_origem: P02
        assunto: 03_experiencias_colaboracao_star
      KP02:
        path: 03_experiencias_colaboracao_star/KP02_feedback.md
        tipo: answer_key_pratica
        arquivo_id: f10-53-2-kp02
        origem: &id252
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/53.2_Ingles_tecnico_e_entrevistas.md
          seletor: '**Feedback e erro comum:'
          linha_inicio: 76
          linha_fim: 76
          texto_literal: '**Feedback e erro comum:** a ação deve mostrar o que você fez, e o resultado precisa ser observável
            ou ter seu limite declarado. Erro comum: falar apenas “we” e deixar incerto qual foi sua contribuição.'
        item_origem: P02
        responde_a: P02
        assunto: 03_experiencias_colaboracao_star
      P03:
        path: 04_raciocinio_tecnico_em_ingles/P03_pratica.md
        tipo: practice
        arquivo_id: f10-53-2-p03
        origem: &id253
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/53.2_Ingles_tecnico_e_entrevistas.md
          seletor: '### Atividade 3 — Simulação técnica e incerteza'
          linha_inicio: 78
          linha_fim: 86
          texto_literal: '### Atividade 3 — Simulação técnica e incerteza

            **Contexto e objetivo:** explicar uma decisão ou solução técnica e lidar com uma lacuna de informação.


            **Instruções:** escolha uma decisão do projeto ou este cenário: “A service retries a timed-out payment request.
            What risks and safeguards would you consider?” Primeiro faça perguntas para esclarecer requisitos; depois apresente
            hipótese, opção, alternativa, trade-off, casos limite e como validaria. Inclua uma informação que você não sabe
            com certeza e demonstre como a verificaria.


            **Entrega:** gravação privada ou transcrição estruturada com pergunta, hipóteses, resposta, validação proposta
            e uma melhoria identificada.


            **Dica gradual:** organize a resposta em “requirements → assumptions → options → risks → validation”. No cenário
            de pagamento, considere idempotência e possível processamento duplicado, sem presumir detalhes não dados.'
        item_origem: P03
        assunto: 04_raciocinio_tecnico_em_ingles
      KP03:
        path: 04_raciocinio_tecnico_em_ingles/KP03_feedback.md
        tipo: answer_key_pratica
        arquivo_id: f10-53-2-kp03
        origem: &id254
          arquivo_origem: docs/courses/trilhacode/Conteudos/Fase_10/53.2_Ingles_tecnico_e_entrevistas.md
          seletor: '**Feedback e erro comum:'
          linha_inicio: 87
          linha_fim: 87
          texto_literal: '**Feedback e erro comum:** verifique se você respondeu ao problema, separou fato de hipótese e explicou
            como validaria. Erro comum: recomendar retry sem considerar duplicidade ou tratar uma suposição como requisito
            confirmado.'
        item_origem: P03
        responde_a: P03
        assunto: 04_raciocinio_tecnico_em_ingles
