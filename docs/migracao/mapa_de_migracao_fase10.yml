          seletor: '**Feedback para revisar:'
          linha_inicio: 65
          linha_fim: 65
          texto_literal: '**Feedback para revisar:** confirme que navegador não recebe a chave, que erro externo vira resposta
            controlada e que o teste não exige consumo de API. Não marque execução real como feita se usou apenas o cliente
            falso; explique a evidência de cada camada separadamente.'
        item_origem: P02
