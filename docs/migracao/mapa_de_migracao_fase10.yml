          seletor: '### Atividade 3 — Medir e definir limites operacionais'
          linha_inicio: 65
          linha_fim: 69
          texto_literal: '### Atividade 3 — Medir e definir limites operacionais

            Execute uma pequena amostra com entradas sintéticas de tamanhos diferentes. Registre tempo até o primeiro fragmento,
            duração total, sucesso/erro/cancelamento e unidade de uso/custo estimado. Defina limite de entrada/saída, timeout,
            concorrência e rate limit por usuário com justificativa para o caso. Confira se proxy ou configuração de deploy
            altera a entrega dos fragmentos e descreva uma política de retenção da telemetria.


            **Entregável:** tabela de medições e limites propostos, gráfico simples ou resumo dos resultados, além de uma
            nota indicando dados que não serão registrados.'
        item_origem: P03
        assunto: 04_observabilidade_privacidade_custo
