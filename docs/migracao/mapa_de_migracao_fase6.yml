fronteiras_curriculares:
  25.x: Fase 3 é canônica para fundamentos de JS/DOM; Fase 6 aplica React, JSX, props e estado sem duplicar fundamentos.
  27.1_18.x_20.x: Fase 5 é canônica para contrato servidor e autenticação; Fase 6 cobre consumo no cliente, estados de request
    e UX.
  27.3_18.1: 18.1 define contrato do backend; 27.3 valida e adapta JSON externo no runtime cliente.
  27.4_20.x: 20.x é canônica para controles e ameaças do servidor; 27.4 cobre contexto do navegador e limites de XSS/CSRF/CORS/cookies.
  28.2_15.1: 15.1 trata cache Redis/servidor; 28.2 trata cache remoto e ciclo de consulta no cliente.
  29.x_24.x_32.1: 24.x é fonte canônica para testes backend e integração de serviço; 29.x foca testes de UI e browser. 32.1
    cobre automação/CI.
  30.x_7.4_12.1: 7.4 cobre algoritmos/complexidade e 12.1 desempenho de dados; 30.x mede interface, bundle e renderização.
  31.4_31.5_projects: 31.4 é base do Trilho A e continua 3.5/API da Fase 5; 31.5 é entrega especializada Trilho B e não duplica
    31.4.
