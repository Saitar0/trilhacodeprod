services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ENV: ${ENV:-development}
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
      DB_NAME: ${DB_NAME:-trilhacode_dev}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      EDITOR_EMAIL: ${EDITOR_EMAIL:-}
      EDITOR_PASSWORD: ${EDITOR_PASSWORD:-}
      STUDENT_EMAIL: ${STUDENT_EMAIL:-}
      STUDENT_PASSWORD: ${STUDENT_PASSWORD:-}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    command: ["sh", "-c", "python -m manage ensure-indexes && python -m manage migrate && if [ \"$$ENV\" != production ]; then python -m manage seed; fi && python -m manage resume-restores && uvicorn server:app --reload --host 0.0.0.0 --port 8000"]
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-http://localhost:8000}
      HOST: 0.0.0.0
      WDS_SOCKET_PORT: ${FRONTEND_PORT:-3000}
      ENABLE_HEALTH_CHECK: ${ENABLE_HEALTH_CHECK:-false}
      DISABLE_EMERGENT_OVERLAY: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo_data:
